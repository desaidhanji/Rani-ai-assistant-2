<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f472b6" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Center Rani Orb -->
  <circle cx="256" cy="256" r="100" fill="url(#orbGrad)" filter="url(#glow)"/>

  <!-- Lotus / Flower icon in center -->
  <g fill="#ffffff" transform="translate(256, 256) scale(1.6) translate(-24, -24)">
    <path d="M24 6 C20 16 14 26 14 36 C18 38 24 38 24 38 C24 38 30 38 34 36 C34 26 28 16 24 6 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M14 36 C10 32 4 28 4 22 C4 16 10 18 14 22 C14 28 14 34 14 36 Z" fill="#ffffff" opacity="0.8"/>
    <path d="M34 36 C38 32 44 28 44 22 C44 16 38 18 34 22 C34 28 34 34 34 36 Z" fill="#ffffff" opacity="0.8"/>
    <circle cx="24" cy="40" r="3" fill="#ffffff"/>
  </g>

  <!-- Sparkle stars -->
  <circle cx="150" cy="140" r="4" fill="#fbcfe8" opacity="0.9"/>
  <circle cx="370" cy="160" r="5" fill="#fbcfe8" opacity="0.9"/>
  <circle cx="360" cy="360" r="3" fill="#e9d5ff" opacity="0.8"/>
  <circle cx="130" cy="350" r="4" fill="#e9d5ff" opacity="0.8"/>
</svg>
